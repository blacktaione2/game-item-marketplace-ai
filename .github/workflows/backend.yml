name: backend

# 백엔드 테스트는 **60건**이다 — 도메인 규칙·인증·로그인·테넌트 격리·알림 흐름.
# `contextLoads()` 는 그중 하나이고, 혼자서도 돌릴 값어치가 있다: 컨텍스트 기동
# 실패가 이 프로젝트에서 실제로 터진 회귀 유형이기 때문이다
# (redisson-spring-boot-starter가 Boot 4에서 RedisProperties 재배치 때문에
# 기동 실패했고, 그래서 지금은 plain redisson + 수동 @Bean 을 쓴다).
#
# 초록 뱃지의 범위는 여전히 좁다 — **Redis 락과 거래 흐름은 수동 검증**이고
# 동시성은 부하테스트가 오버셀 0건으로 단언한다. README에 같은 단서가 있다.
#
# > 이 주석은 *"`contextLoads()` 한 건뿐"* 이라고 적혀 있었다. ADR-0030·0031·0034
# > 가 행동 테스트를 더하면서 낡았는데, 같은 문장의 사본이 CLAUDE.md·README·
# > 발표 노트에도 있어서 **네 번에 걸쳐 따로 고쳐졌다.** 마지막까지 남은 게 여기다 —
# > 앞선 점검의 `grep` 범위가 `docs/` 였기 때문이다. 사례 28.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # GHA service containers 대신 저장소의 compose 파일을 그대로 쓴다.
      # service containers 는 `command` 를 지정할 수 없어서 Redis를
      # `--requirepass` 로 띄울 수 없고, 그러면 RedissonConfig가 보내는 AUTH가
      # 거절돼 로컬과 다른 구성이 된다. compose를 쓰면 로컬과 동일하고
      # compose 파일 자체도 덤으로 검증된다.
      # ES와 RabbitMQ는 백엔드가 붙지 않으므로(build.gradle에 의존성 없음) 뺀다 —
      # ES는 커스텀 이미지 빌드까지 필요해서 비용이 크다.
      - name: Postgres · Redis 기동
        run: docker compose up -d postgres redis

      - name: 헬스체크 대기
        run: |
          for i in $(seq 1 30); do
            pg=$(docker inspect -f '{{.State.Health.Status}}' gimp-postgres)
            rd=$(docker inspect -f '{{.State.Health.Status}}' gimp-redis)
            echo "postgres=$pg redis=$rd"
            [ "$pg" = healthy ] && [ "$rd" = healthy ] && exit 0
            sleep 2
          done
          echo "컨테이너가 healthy 가 되지 않았다"
          docker compose logs postgres redis
          exit 1

      - name: 빌드 + 테스트
        working-directory: backend
        # JWT_SECRET을 명시한다. application.yml에 개발 기본값이 있어서 없어도
        # 돌긴 하지만, CI가 그 기본값에 의존하면 기본값을 지우는 순간 조용히
        # 깨진다. HS256이라 32바이트 이상이어야 한다.
        env:
          JWT_SECRET: ci_test_secret_not_used_anywhere_32b
        run: ./gradlew build --no-daemon
