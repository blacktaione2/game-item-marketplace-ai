# 배포 시 단일 오리진을 만드는 자리.
#
# 개발에서는 Vite dev proxy가 이 역할을 했고, **그래서 두 서버에 CORS 설정이
# 한 줄도 없다.** 배포하면 dev 서버가 사라지므로 같은 경로 규칙을 여기서
# 재현한다 — 대안은 두 서버에 CORS를 넣는 것인데, 여섯 단계 동안 안 건드린
# 서버 코드를 배포 때문에 건드리게 된다(ADR-0029).
#
# 경로 규칙은 frontend/vite.config.ts 와 **같아야 한다.** 둘이 어긋나면
# 개발에서는 되고 배포에서만 깨진다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 폴백. 이게 없으면 `/items/3` 을 새로고침할 때 nginx가 그 경로의
    # 파일을 찾다가 404를 낸다 — dev 서버가 가려주고 있어서 안 보이던 결함이다.
    # React Router가 클라이언트에서 경로를 해석하므로 항상 index.html을 준다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 자산은 내용이 바뀌면 이름이 바뀐다. 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/backend/* -> backend:8080/api/*
    location /api/backend/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Authorization 헤더는 기본으로 전달된다. 명시적으로 지우지 않는다.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/ai/* -> ai:8000/api/*
    #
    # AI 검색은 LLM 2회를 기다리므로 p95가 4.45초다(ADR-0020). nginx 기본
    # 타임아웃 60초로도 되지만, 에이전트 분기는 7~25초까지 가므로 여유를 둔다.
    location /api/ai/ {
        proxy_pass http://ai:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # --- 알려진 동작 변화: IP 키 한도가 하나로 합쳐진다 ---------------------
    #
    # `/api/auth/demo-token` 은 IP 단위 30회/분이다(인증 이전이라 신원이 없어서).
    # 그런데 프록시를 거치면 백엔드가 보는 remote_addr 이 **전부 nginx** 라서,
    # 30회/분이 배포 전체의 합계가 된다. 사용자별이 아니다.
    #
    # **X-Forwarded-For 를 만들지 않는다.** ADR-0024 가 XFF 를 안 읽기로 한 근거는
    # "신뢰할 수 있는 리버스 프록시가 전제되지 않으면 스푸핑으로 한도를 우회할 수
    # 있다"였는데, 이번 배포로 **그 전제가 생겼다.** 즉 조건이 바뀌었다.
    #
    # 그럼에도 이번 범위에서 고치지 않는다 — 백엔드가 XFF 를 읽게 하려면
    # "프록시의 IP 에서 온 요청일 때만 신뢰"하는 처리가 같이 필요하고, 그건
    # 보안 경로 변경이라 별도 측정과 실패 케이스가 붙어야 한다. 데모 배포에서
    # 30회/분 공유는 실사용에 지장이 없다(사용자 전환당 1~2회).
    # 로드맵에 트리거와 함께 등록했다.
}
