# 배포 시 단일 오리진을 만드는 자리.
#
# 개발에서는 Vite dev proxy가 이 역할을 했고, **그래서 두 서버에 CORS 설정이
# 한 줄도 없다.** 배포하면 dev 서버가 사라지므로 같은 경로 규칙을 여기서
# 재현한다 — 대안은 두 서버에 CORS를 넣는 것인데, 여섯 단계 동안 안 건드린
# 서버 코드를 배포 때문에 건드리게 된다(ADR-0029).
#
# 경로 규칙은 frontend/vite.config.ts 와 **같아야 한다.** 둘이 어긋나면
# 개발에서는 되고 배포에서만 깨진다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 폴백. 이게 없으면 `/items/3` 을 새로고침할 때 nginx가 그 경로의
    # 파일을 찾다가 404를 낸다 — dev 서버가 가려주고 있어서 안 보이던 결함이다.
    # React Router가 클라이언트에서 경로를 해석하므로 항상 index.html을 준다.
    #
    # **index.html 은 절대 캐시하지 않는다.** 아래 /assets/ 와 짝이다: 자산은
    # 이름에 해시가 박혀 영구 캐시가 안전하지만, **그 이름을 알려주는 것이
    # index.html 하나뿐**이라 이게 낡으면 새 배포가 브라우저에 아예 도달하지
    # 못한다.
    #
    # 지시를 안 적으면 "캐시 안 함"이 아니라 **브라우저 휴리스틱**이 적용된다
    # (Last-Modified 기준 경험칙). 실제로 겪었다 — 배포가 정상이고 이미지 안
    # 번들에도 새 코드가 들어 있는데 화면만 옛것이었고, 강력 새로고침으로만
    # 풀렸다. `no-cache` 는 "저장 금지"가 아니라 **쓰기 전에 확인하라**는 뜻이라
    # 대개 304 로 끝난다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 해시가 박힌 자산은 내용이 바뀌면 이름이 바뀐다. 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /api/backend/* -> backend:8080/api/*
    location /api/backend/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        # Authorization 헤더는 기본으로 전달된다. 명시적으로 지우지 않는다.
        proxy_set_header X-Real-IP $remote_addr;
        # **이 줄이 없으면 클라이언트가 보낸 XFF 가 그대로 백엔드에 도달한다** —
        # nginx 는 설정하지 않은 헤더를 지우지 않고 넘긴다. 백엔드는 신뢰 프록시에서
        # 온 요청의 XFF **마지막 값**을 클라이언트 IP 로 쓰므로(ADR-0031),
        # 그 값을 여기서 반드시 우리가 붙여야 한다.
        #
        # `$proxy_add_x_forwarded_for` = 들어온 XFF + ", " + $remote_addr 이라
        # **마지막 원소가 nginx 가 실제로 본 주소**다. 백엔드의 "맨 뒤를 쓴다"와 짝이다.
        # 없이 TRUSTED_PROXIES 만 켜면 위조 XFF 로 한도를 무제한 우회할 수 있다
        # (실측: 위조 40회 전부 통과 / 헤더 없으면 31번째 429). ADR-0033.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/ai/* -> ai:8000/api/*
    #
    # AI 검색은 LLM 2회를 기다리므로 p95가 4.45초다(ADR-0020). nginx 기본
    # 타임아웃 60초로도 되지만, 에이전트 분기는 7~25초까지 가므로 여유를 둔다.
    location /api/ai/ {
        proxy_pass http://ai:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 위와 같은 이유. AI 서버의 한도는 토큰의 tenant+user 로 키를 잡아 지금은
        # IP 를 안 보지만, **두 경로가 다른 헤더를 받는 상태를 남기지 않는다** —
        # 나중에 IP 를 보게 되는 쪽이 조용히 위조 가능해진다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # --- IP 단위 한도가 실제로 사용자별로 걸리려면 위의 XFF 줄이 필요하다 ------
    #
    # `/api/auth/login` 은 IP 단위 30회/분이다(인증 이전이라 신원이 없어서).
    # 프록시를 거치면 백엔드가 보는 remote_addr 이 **전부 nginx** 라서, XFF 가
    # 없으면 30회/분이 배포 전체의 합계가 된다 — 사용자별이 아니다.
    #
    # **이 파일은 원래 XFF 를 만들지 않았고, 그게 결함이었다.** ADR-0024 가 XFF 를
    # 안 읽기로 한 근거("신뢰할 프록시가 전제되지 않으면 스푸핑으로 우회된다")는
    # 그때는 맞았다. ADR-0031 이 백엔드에 "신뢰 목록에 있는 출처의 XFF 만 읽는다"를
    # 넣어 전제를 만들었는데, **정작 그 값을 붙이는 쪽을 안 고쳤다.**
    #
    # 결과가 의도와 정반대였다 — nginx 는 설정하지 않은 헤더를 지우지 않으므로
    # 클라이언트의 XFF 가 그대로 통과했고, 런북대로 TRUSTED_PROXIES 를 채우면
    # **한도가 사라졌다**(실측: 위조 40회 전부 통과 / 헤더 없으면 31번째 429).
    # 안 채우면 안전한 대신 한도가 전체 합계였다 — 안전한 설정과 올바른 설정이
    # 양립하지 않는 상태였다. ADR-0033 에서 위 한 줄로 해소했다.
}
