spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gimp}
    username: ${DB_USERNAME:gimp}
    password: ${DB_PASSWORD:gimp_local_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:gimp_local_pw}

  # 체결 후 알림 큐 (ADR-0030).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:gimp}
    password: ${RABBITMQ_PASSWORD:gimp_local_pw}
    # **fail-open 의 지연 상한이다.** 발행은 커밋 직후 같은 스레드에서 일어나므로
    # (@TransactionalEventListener AFTER_COMMIT) 응답 전에 끝나야 한다. 클라이언트
    # 기본 연결 타임아웃은 60초라, 브로커가 죽으면 "구매가 성공은 하는데 1분 걸린다"가
    # 된다 — fail-open 의 정신에 어긋나면서 "성공했다"는 판정은 통과하는 상태다.
    connection-timeout: 2s
    template:
      retry:
        # 재시도는 위 지연을 배로 만든다. 알림은 부가 기능이라 한 번 실패하면 포기한다.
        enabled: false
    listener:
      simple:
        # 소비 실패 시 무한 재전달을 막는다. 소진되면 큐 정의의 DLX 로 간다(RabbitConfig).
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}

# 인증(ADR-0023). 대칭키라 **AI 서버의 ai/.env에도 같은 값**이 있어야 한다 —
# 다르면 발급은 되는데 AI 서버만 401을 낸다. HS256이라 32바이트 이상이어야 한다.
jwt:
  secret: ${JWT_SECRET:gimp_local_dev_secret_change_me_32b}
  issuer: gimp-backend
  ttl-seconds: 3600

# 요청 한도 (ADR-0024). 이 값들이 **운영 기본값**이다.
#
# 부하테스트는 이 한도에 걸린다. 그때 여기 숫자를 손으로 고치면 되돌리는 걸 잊을 수 있으므로
# 그렇게 하지 않는다 — `application-loadtest.yml`에 완화된 값을 따로 두고
# `SPRING_PROFILES_ACTIVE=loadtest` 로 띄운다. 프로파일은 기동 인자라 파일에 남지 않고,
# 어떤 값으로 돌았는지가 실행 명령에 드러난다(우회 헤더를 기각한 것과 같은 기준이다).
rate-limit:
  enabled: true
  # 거래(구매·입찰) — 검증된 사용자 단위.
  # 실측 상한이 107 req/s인데(ADR-0020) 그건 전체 처리량이고, 한 사용자가 그중 상당 부분을
  # 차지할 이유가 없다.
  trade:
    permits: 10
    window-seconds: 1
  # 토큰 발급 — IP 단위(인증 이전이라 신원이 없다).
  # 정상 사용은 사용자 전환당 1~2회다(개발 모드 StrictMode 이중 호출 포함).
  demo-token:
    permits: 30
    window-seconds: 60

ai-server:
  base-url: ${AI_SERVER_URL:http://localhost:8000}

# 관측성. Prometheus를 상시 띄우지 않아도 /actuator/prometheus 는 쓸모가 있다 —
# 히스토그램이 누적값이라 부하테스트 전후로 받아 차분하면 실행 구간 집계가 나온다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 켜야 URI별 지연 분위수를 볼 수 있다. 끄면 카운트와 합계만 남는다.
      percentiles-histogram:
        http.server.requests: true
        trade.lock.wait: true
        trade.lock.hold: true

logging:
  level:
    org.hibernate.SQL: debug
