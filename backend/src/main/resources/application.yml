spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gimp}
    username: ${DB_USERNAME:gimp}
    password: ${DB_PASSWORD:gimp_local_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:gimp_local_pw}

server:
  port: ${SERVER_PORT:8080}

# 인증(ADR-0023). 대칭키라 **AI 서버의 ai/.env에도 같은 값**이 있어야 한다 —
# 다르면 발급은 되는데 AI 서버만 401을 낸다. HS256이라 32바이트 이상이어야 한다.
jwt:
  secret: ${JWT_SECRET:gimp_local_dev_secret_change_me_32b}
  issuer: gimp-backend
  ttl-seconds: 3600

ai-server:
  base-url: ${AI_SERVER_URL:http://localhost:8000}

# 관측성. Prometheus를 상시 띄우지 않아도 /actuator/prometheus 는 쓸모가 있다 —
# 히스토그램이 누적값이라 부하테스트 전후로 받아 차분하면 실행 구간 집계가 나온다.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # 켜야 URI별 지연 분위수를 볼 수 있다. 끄면 카운트와 합계만 남는다.
      percentiles-histogram:
        http.server.requests: true
        trade.lock.wait: true
        trade.lock.hold: true

logging:
  level:
    org.hibernate.SQL: debug
