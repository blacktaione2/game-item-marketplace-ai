services:
  postgres:
    image: postgres:16-alpine
    container_name: gimp-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gimp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gimp_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-gimp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gimp} -d ${POSTGRES_DB:-gimp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: gimp-elasticsearch:8.13.4-nori
    container_name: gimp-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES_HEAP_SIZE:-512m} -Xmx${ES_HEAP_SIZE:-512m}"
    ports:
      - "${ES_HTTP_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gimp-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-gimp_local_pw}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-gimp_local_pw} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gimp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gimp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gimp_local_pw}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 애플리케이션 (선택: --profile app) -------------------------------
  #
  # **기본 기동에서 빼둔 이유가 자원이 아니다.** `docker compose up -d` 는 지금까지
  # "인프라만 띄운다"는 뜻이었고, README·CLAUDE.md·CI(backend 워크플로)가 전부 그
  # 전제 위에 있다. 여기에 앱을 끼워 넣으면 그 명령의 의미가 조용히 바뀐다.
  # 로컬 프로세스로 개발하는 경로가 여전히 1급이다 — 컨테이너는 "배포하면 뜨는가"를
  # 확인하는 경로이지 개발 루프가 아니다(HMR을 잃는다).
  #
  #   docker compose up -d                    # 인프라만 (기존과 동일)
  #   docker compose --profile app up -d      # 전체
  #
  # ## 기동 순서 — healthcheck 로는 절반만 해결된다
  #
  # 준비 상태가 세 층인데 `service_healthy` 는 첫 층만 답한다.
  #
  #   (1) 프로세스가 연결을 받는가  -> healthcheck
  #   (2) 스키마가 있는가          -> backend 가 부팅하며 만든다(ddl-auto: update)
  #   (3) **데이터가 있는가**       -> 아무도 자동으로 안 한다 -> ai-init / db-seed
  #
  # 세 번째가 빠지면 기동은 성공하는데 검색이 0건이고 상세 화면이 빈다. 실패가
  # 아니라 "조용히 이상함"으로 나타나서 더 나쁘다.
  #
  # 그리고 **의존성으로 못 막는 게 하나 있다**: AI 서버의 Redis 연결은 지연
  # 연결이라 Redis 가 죽어 있어도 기동은 성공하고 첫 요청에서 드러난다. 여기
  # depends_on 을 걸어두지만 그게 보호막이라고 믿으면 안 된다 — 그 경로를 지키는
  # 것은 리미터의 fail-open 과 캐시의 try/except 다(ADR-0024).

  ai-init:
    build:
      context: ./ai
    image: gimp-ai:local
    container_name: gimp-ai-init
    profiles: [app]
    env_file:
      # 키는 ai/.env 에 있다(루트 .env 가 아니다 — CLAUDE.md 참고). 컨테이너에도
      # 그 규칙을 그대로 지킨다.
      - ./ai/.env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ai_models:/app/models
    depends_on:
      elasticsearch:
        condition: service_healthy
    # 모델 650MB 생성 + ES 색인. **LLM 을 부르지 않는다** — 학습 트리플과 의도
    # 학습 데이터는 재현성 때문에 ai/data/ 에 커밋돼 있다.
    # 이미 만들어져 있으면 건너뛴다. 안 그러면 `up` 할 때마다 재학습한다.
    command: >
      sh -c '
      if [ -f models/embedding-finetuned/config.json ]; then
        echo "[ai-init] 모델이 이미 있습니다 - 학습 생략";
      else
        python -m scripts.finetune_embedding &&
        python -m scripts.build_reranker_onnx &&
        python -m scripts.train_forecast &&
        python -m scripts.train_anomaly &&
        python -m scripts.train_intent_router;
      fi &&
      python -m scripts.seed_items --recreate'
    restart: "no"

  backend:
    build:
      context: ./backend
    image: gimp-backend:local
    container_name: gimp-backend
    profiles: [app]
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-gimp_local_pw}
      # ADR-0030에서 빠뜨렸던 것. 컨테이너 안의 localhost 는 자기 자신이라
      # 백엔드가 5672 를 자기한테 물었고, **actuator/health 가 503** 이 됐다.
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-gimp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-gimp_local_pw}
      AI_SERVER_URL: http://ai:8000
      # 대칭키라 AI 서버와 **같은 값**이어야 한다. 다르면 발급은 되는데 AI 만 401.
      JWT_SECRET: ${JWT_SECRET:-gimp_local_dev_secret_change_me_32b}
      # 부하테스트는 운영 한도에 걸린다. **완화된 값을 파일에 적지 않는다** —
      # 되돌리는 걸 잊을 수 없게 기동 인자로만 넘긴다(ADR-0024와 같은 이유).
      #   SPRING_PROFILES_ACTIVE=loadtest docker compose --profile app up -d backend
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      # nginx 뒤에 있어도 직접 노출한다. `load/` 하네스가 8080 을 때리고
      # snapshot_metrics.py 가 /actuator/prometheus 를 긁는다 — 막으면 측정 도구가
      # 조용히 깨진다(잠갔을 때 빈 차분이 나오지 에러가 나지 않는다).
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 알림 큐(ADR-0030). **다만 이건 기동 순서일 뿐 보호막이 아니다** —
      # 브로커가 나중에 죽어도 거래는 계속돼야 한다(fail-open).
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # 포트가 아니라 **애플리케이션**에 묻는다. 포트만 보면 아직 기동 중인
      # JVM 도 통과시킨다.
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # 데모 데이터. **backend 가 뜬 뒤에만 가능하다** — 테이블을 backend 가
  # 만들기 때문에(ddl-auto: update) ai-init 에 합칠 수 없다.
  db-seed:
    image: postgres:16-alpine
    container_name: gimp-db-seed
    profiles: [app]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-gimp_local_pw}
    volumes:
      - ./backend/src/main/resources/db:/seed:ro
    depends_on:
      backend:
        condition: service_healthy
    command: >
      sh -c 'psql -h postgres -U ${POSTGRES_USER:-gimp} -d ${POSTGRES_DB:-gimp}
      -v ON_ERROR_STOP=1 -f /seed/seed-demo.sql'
    restart: "no"

  ai:
    build:
      context: ./ai
    image: gimp-ai:local
    container_name: gimp-ai
    profiles: [app]
    env_file:
      - ./ai/.env
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-gimp_local_dev_secret_change_me_32b}
    ports:
      # backend 와 같은 이유 — 부하 하네스가 8000 을 직접 때린다.
      - "${AI_PORT:-8000}:8000"
    volumes:
      - ai_models:/app/models
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-init:
        condition: service_completed_successfully
    healthcheck:
      # slim 이미지에 curl 이 없다. 파이썬은 있으니 그걸 쓴다 — 헬스체크 하나
      # 때문에 패키지를 늘리지 않는다.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
    image: gimp-web:local
    container_name: gimp-web
    profiles: [app]
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy

  # --- 관측 스택 (선택) -------------------------------------------------
  # `docker compose --profile observability up` 일 때만 뜬다.
  #
  # 기본 기동에서 빼둔 이유가 자원 절약만은 아니다. 배포 대상이 다른 프로젝트와
  # 공유하는 4 OCPU라, **부하테스트 중에 같은 박스에서 스크래핑하면 측정 대상과
  # 부하 생성기에서 CPU를 뺏는다.** 부하테스트는 /metrics 를 전후로 받아
  # 차분하는 쪽이 정확하고(히스토그램은 누적값이다), 대시보드는 데모 때만 켠다.
  #
  # 두 서비스는 호스트의 백엔드(8080)·AI(8000)를 긁으므로
  # host.docker.internal 을 쓴다. 앱을 컨테이너로 올리면 서비스명으로 바꾼다.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gimp-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: gimp-grafana
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-gimp_local_pw}
      # 데모 편의. 인증 없는 배포를 노출하지 말라는 경고가 README에 있다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # 대시보드를 코드로 둔다 — UI에서 만들면 재현이 안 된다.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  es_data:
  redis_data:
  rabbitmq_data:
  # 모델 650MB. 이미지에 넣지 않는 이유는 ai/Dockerfile 참고 —
  # 요약하면 다국어 어휘(25만) 때문에 큰 것이고, 이미지에 넣으면 모델을 다시
  # 만들 때마다 이미지를 다시 만들어야 한다.
  ai_models:
  prometheus_data:
  grafana_data:
