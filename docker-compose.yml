services:
  postgres:
    image: postgres:16-alpine
    container_name: gimp-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gimp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gimp_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-gimp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gimp} -d ${POSTGRES_DB:-gimp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    build:
      context: ./docker/elasticsearch
    image: gimp-elasticsearch:8.13.4-nori
    container_name: gimp-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms${ES_HEAP_SIZE:-512m} -Xmx${ES_HEAP_SIZE:-512m}"
    ports:
      - "${ES_HTTP_PORT:-9200}:9200"
      - "${ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gimp-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-gimp_local_pw}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-gimp_local_pw} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gimp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gimp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gimp_local_pw}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 관측 스택 (선택) -------------------------------------------------
  # `docker compose --profile observability up` 일 때만 뜬다.
  #
  # 기본 기동에서 빼둔 이유가 자원 절약만은 아니다. 배포 대상이 다른 프로젝트와
  # 공유하는 4 OCPU라, **부하테스트 중에 같은 박스에서 스크래핑하면 측정 대상과
  # 부하 생성기에서 CPU를 뺏는다.** 부하테스트는 /metrics 를 전후로 받아
  # 차분하는 쪽이 정확하고(히스토그램은 누적값이다), 대시보드는 데모 때만 켠다.
  #
  # 두 서비스는 호스트의 백엔드(8080)·AI(8000)를 긁으므로
  # host.docker.internal 을 쓴다. 앱을 컨테이너로 올리면 서비스명으로 바꾼다.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gimp-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.1
    container_name: gimp-grafana
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-gimp_local_pw}
      # 데모 편의. 인증 없는 배포를 노출하지 말라는 경고가 README에 있다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # 대시보드를 코드로 둔다 — UI에서 만들면 재현이 안 된다.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  es_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
